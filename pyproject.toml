[project]
name = "insulation-coordination-calculator"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "jinja2>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "pillow>=12,<13",
  "platformdirs>=4,<5",
  "pydantic>=2.11,<3",
  "pypdf>=6.16.0,<7",
  "PySide6>=6.8,<7",
]

[project.scripts]
icc = "insulation_coordination.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.165.2,<7",
  "mypy>=2.3.0,<3",
  "pyinstaller>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "pytest-qt>=4.4,<5",
  "pytest-timeout>=2.3,<3",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.16.1,<1",
]

[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insulation_coordination"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A modal dialog nobody can answer blocks a UI test forever; without this the
# whole job hangs until the 30-minute CI timeout and names no test.
addopts = "--strict-markers --timeout=120"
markers = ["private_standard: requires ignored licensed PDFs"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["insulation_coordination"]
