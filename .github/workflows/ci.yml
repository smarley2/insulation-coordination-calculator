name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
          prune-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      # Fails on findings the reviewed baseline in docs/licensed-content-audit.md
      # does not already account for, in either direction. The step prints what a
      # green result does not cover; read it before treating a pass as an all-clear.
      - name: Licensed-content gate (structural findings only, not a clean-tree guarantee)
        run: uv run python scripts/scan_licensed_content.py . --strict
      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run pytest
          -n auto
          --cov=insulation_coordination
          --cov-branch
          --cov-report=term-missing
