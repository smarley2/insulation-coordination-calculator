name: Refresh Native Tectonic Locks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Lock ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
          - platform: macos-arm64
            os: macos-14
          - platform: linux-x86_64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          prune-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/create_release_fixtures.py release-smoke
      - name: Refresh native lock
        run: >-
          uv run python scripts/prepare_tectonic.py
          --platform ${{ matrix.platform }}
          --destination build/tectonic/${{ matrix.platform }}
          --fixtures release-smoke
          --refresh-lock
      - name: Verify refreshed native lock
        run: >-
          uv run python scripts/prepare_tectonic.py
          --platform ${{ matrix.platform }}
          --destination build/tectonic/${{ matrix.platform }}
          --fixtures release-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tectonic-lock-${{ matrix.platform }}
          path: build/tectonic/${{ matrix.platform }}/tectonic-locks/${{ matrix.platform }}.json
          if-no-files-found: error
