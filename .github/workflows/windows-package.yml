name: Windows Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - name: Package with PyInstaller
        run: uv run pyinstaller --noconfirm packaging/insulation_coordination.spec
      - name: Download pinned offline Tectonic
        run: |
          Invoke-WebRequest -Uri "$env:TECTONIC_WINDOWS_URL" -OutFile dist\icc\tectonic.exe
          (Get-FileHash dist\icc\tectonic.exe -Algorithm SHA256).Hash.ToLower() | Out-File dist\icc\tectonic.sha256
        env:
          TECTONIC_WINDOWS_URL: https://example.invalid/tectonic-windows.tar.gz
      - name: Installer
        run: |
          $setup = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "Inno Setup not found" }
          & $setup.FullName /Q installer\insulation-coordination.iss
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            Output\*.exe
            dist\icc\icc.exe
            dist\icc\tectonic.sha256
            tests\.pytest_cache\**\*.log
