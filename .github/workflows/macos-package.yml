name: macOS Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - name: Package with PyInstaller
        run: uv run pyinstaller --noconfirm --windowed packaging/insulation_coordination.spec
      - name: Download pinned offline Tectonic
        run: |
          curl -fsSL "$TECTONIC_MACOS_URL" -o dist/icc/tectonic
          chmod +x dist/icc/tectonic
          shasum -a 256 dist/icc/tectonic | awk '{print $1}' > dist/icc/tectonic.sha256
        env:
          TECTONIC_MACOS_URL: https://example.invalid/tectonic-macos.tar.gz
      - name: Create .app bundle
        run: |
          mkdir -p "dist/Insulation Coordination Calculator.app/Contents/MacOS"
          mkdir -p "dist/Insulation Coordination Calculator.app/Contents/Resources"
          cp -R dist/icc/* "dist/Insulation Coordination Calculator.app/Contents/MacOS/"
          cat > "dist/Insulation Coordination Calculator.app/Contents/Info.plist" <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleExecutable</key><string>icc</string>
  <key>CFBundleIdentifier</key><string>ch.insulation-coordination.icc</string>
  <key>CFBundleName</key><string>Insulation Coordination Calculator</string>
  <key>CFBundlePackageType</key><string>APPL</string>
  <key>CFBundleDocumentTypes</key>
  <array>
    <dict>
      <key>CFBundleTypeName</key><string>ICC Project</string>
      <key>CFBundleTypeExtensions</key><array><string>icproj</string></array>
      <key>CFBundleTypeRole</key><string>Editor</string>
    </dict>
    <dict>
      <key>CFBundleTypeName</key><string>ICC Rules</string>
      <key>CFBundleTypeExtensions</key><array><string>icrules</string></array>
      <key>CFBundleTypeRole</key><string>Editor</string>
    </dict>
  </array>
</dict>
</plist>
PLIST
      - name: Zip app bundle
        run: ditto -c -k --keepParent "dist/Insulation Coordination Calculator.app" "dist/InsulationCoordination-macOS.zip"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            dist/InsulationCoordination-macOS.zip
            dist/icc/tectonic.sha256
